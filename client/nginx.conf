server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames are immutable, so cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or users get a stale shell that references
  # deleted asset hashes after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Proxy the API so the browser sees one origin and auth cookies just work.
  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: client-side routes like /analytics must return index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
