name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint --workspace client

      # Catches syntax errors and unresolvable imports before deploy.
      - name: Type/parse check server
        run: |
          find server/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build client
        run: npm run build --workspace client

      - name: Run tests
        run: npm test --if-present

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      # Build both images so a broken Dockerfile fails CI, not the deploy.
      - name: Build API image
        run: docker build -t reflect-api ./server
      - name: Build web image
        run: docker build -t reflect-web ./client
