services:
  - type: web
    runtime: node
    name: passionjournalai
    plan: free
    buildCommand: "npm ci --include=dev && npm run build"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://passionjournalai.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://passionjournalai.onrender.com/api/v1/auth/google/callback